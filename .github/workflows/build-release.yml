name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  AGENT_VERSION: "v2026.7.20"

jobs:
  cleanup-artifacts:
    name: Clean Up Old Artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all artifacts from previous runs
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.expired) continue;
              console.log(`Deleting: ${artifact.name} (${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MB, run #${artifact.workflow_run.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
            console.log(`Cleaned ${artifacts.data.total_count} artifact(s)`);

  build:
    name: Build & Package
    runs-on: windows-latest
    needs: [cleanup-artifacts]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ── Build Runtime Bundle ─────────────────────────────────────────
      - name: Download hermes-agent source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/NousResearch/hermes-agent/archive/refs/tags/${{ env.AGENT_VERSION }}.tar.gz" -OutFile agent.tar.gz
          New-Item -ItemType Directory -Force -Path build\hermes-src | Out-Null
          tar xzf agent.tar.gz -C build\hermes-src
          Move-Item build\hermes-src\hermes-agent-* build\hermes-src\hermes-agent

      - name: Create venv and install hermes-agent
        shell: pwsh
        run: |
          $targetRoot = "build\runtime-bundle\hermes-agent"
          New-Item -ItemType Directory -Force -Path $targetRoot | Out-Null

          # Copy source tree (needed for isHermesSourceRoot detection)
          Copy-Item -Recurse "build\hermes-src\hermes-agent\*" $targetRoot

          # Create venv inside the source tree (matches upstream layout)
          uv venv "$targetRoot\venv" --python 3.11

          # Non-editable install so venv is relocatable
          # Use string concat to avoid PowerShell interpreting [all,web] as indexer
          $installSpec = "${targetRoot}[all,web]"
          uv pip install --python "$targetRoot\venv\Scripts\python.exe" `
            "$installSpec" `
            --no-cache-dir

      - name: Install PortableGit
        shell: pwsh
        run: |
          $gitUrl = "https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.1/PortableGit-2.47.1-64-bit.7z.exe"
          Invoke-WebRequest -Uri $gitUrl -OutFile PortableGit.exe
          New-Item -ItemType Directory -Force -Path build\runtime-bundle\git | Out-Null
          Start-Process -FilePath .\PortableGit.exe -ArgumentList "-o", "build\runtime-bundle\git", "-y" -Wait

      - name: Verify runtime bundle
        shell: pwsh
        run: |
          $hermesExe = "build\runtime-bundle\hermes-agent\venv\Scripts\hermes.exe"
          if (Test-Path $hermesExe) {
            Write-Host "hermes.exe found" -ForegroundColor Green
            & $hermesExe --version
          } else {
            Write-Host "ERROR: hermes.exe not found" -ForegroundColor Red
            exit 1
          }

          $mainPy = "build\runtime-bundle\hermes-agent\hermes_cli\main.py"
          if (Test-Path $mainPy) {
            Write-Host "hermes_cli/main.py found (source root marker)" -ForegroundColor Green
          } else {
            Write-Host "ERROR: hermes_cli/main.py not found" -ForegroundColor Red
            exit 1
          }

      # ── Build Electron Desktop App ──────────────────────────────────
      - name: Checkout hermes-agent (for Electron build)
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.AGENT_VERSION }}
          path: hermes-agent

      - name: Install workspace dependencies
        shell: pwsh
        working-directory: hermes-agent
        run: npm ci

      - name: Build unpacked Electron app
        shell: pwsh
        working-directory: hermes-agent/apps/desktop
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ env.AGENT_VERSION }}
        run: npm run pack

      - name: Stage Electron app for packaging
        shell: pwsh
        run: |
          $src = "hermes-agent\apps\desktop\release\win-unpacked"
          if (-not (Test-Path "$src\Hermes.exe")) {
            Write-Host "ERROR: Hermes.exe not found at $src" -ForegroundColor Red
            Get-ChildItem -Recurse "hermes-agent\apps\desktop\release" -ErrorAction SilentlyContinue | Select-Object -First 20
            exit 1
          }
          Copy-Item -Recurse $src "build\electron-app"
          Write-Host "Electron app staged to build\electron-app" -ForegroundColor Green

      # ── Package Installer (tag push only) ───────────────────────────
      - name: List build outputs
        shell: pwsh
        run: |
          echo "=== Runtime bundle ==="
          Get-ChildItem -Recurse build\runtime-bundle -Depth 1 | Select-Object FullName
          echo "=== Electron app ==="
          Get-ChildItem build\electron-app | Select-Object Name

      - name: Install ChineseSimplified language file
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $dest = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          $url  = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          if (-not (Test-Path $dest)) { throw "Failed to download ChineseSimplified.isl" }
          Write-Host "Installed: $dest ($((Get-Item $dest).Length) bytes)"

      - name: Build installer with Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/hermes-win.iss

      - name: Upload installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: hermes-installer
          path: build/HermesSetup-*.exe
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: hermes-installer
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Hermes ${{ github.ref_name }}"
          body: |
            ## Hermes Windows Offline Installer ${{ github.ref_name }}

            ### Downloads

            - **HermesSetup-*.exe** — Full offline installer (no internet required)

            ### What's Included

            - Hermes Desktop App (Electron) — full-featured GUI with chat, file browser, voice, settings
            - Hermes Agent runtime (pre-built Python venv, offline)
            - PortableGit for shell tools
            - Optional: Browser automation (Playwright + Chromium)
            - Optional: Voice / speech (STT + TTS)

            ### System Requirements

            - Windows 10 (1809+) or Windows 11
            - 4GB+ disk space (core), 8GB+ (full)
            - No internet required for installation
          files: |
            release/HermesSetup-*.exe
          draft: false
          prerelease: false
