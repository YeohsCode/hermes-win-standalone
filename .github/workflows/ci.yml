name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-scripts:
    name: Validate Installer Scripts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path installer/scripts -Filter *.ps1 | ForEach-Object {
            Write-Host "Checking $($_.Name)..."
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "  ERRORS in $($_.Name):" -ForegroundColor Red
              $parseErrors | ForEach-Object { Write-Host "    $_" -ForegroundColor Red }
              $errors++
            } else {
              Write-Host "  OK" -ForegroundColor Green
            }
          }
          if ($errors -gt 0) { exit 1 }

      - name: Validate Inno Setup script references
        shell: pwsh
        run: |
          $issContent = Get-Content installer/hermes-win.iss -Raw
          Write-Host "Inno Setup script loaded ($($issContent.Length) chars)" -ForegroundColor Green

          # Check that required script files exist
          $requiredScripts = @("installer/scripts/setup-hermes.ps1", "installer/scripts/uninstall.ps1")
          foreach ($script in $requiredScripts) {
            if (Test-Path $script) {
              Write-Host "  $script exists" -ForegroundColor Green
            } else {
              Write-Host "  MISSING: $script" -ForegroundColor Red
              exit 1
            }
          }
